<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#5b68bb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <!-- maximum-scale=1 + user-scalable=no -- matiin pinch-zoom total di
         mobile. Efek samping (sekaligus manfaat): ini juga otomatis nutup
         bug lama "auto-zoom iOS pas fokus ke input field", soalnya iOS
         Safari matu-zoom itu sebenernya cuma nurutin batas maximum-scale
         yang sama ini -- jadi nggak perlu solusi terpisah (naikin
         font-size ke 16px) buat masalah itu lagi. Tradeoff: user yang
         butuh pinch-zoom buat baca teks kecil (misal low-vision) jadi
         nggak bisa zoom sama sekali di app ini. -->
    <!-- viewport-fit=cover WAJIB ada buat env(safe-area-inset-bottom) di
         CSS bisa kebaca di iPhone/Safari. Tanpa ini, browser nggak
         "meluaskan" halaman sampe ke area gesture-bar/notch, jadi
         env(safe-area-inset-bottom) selalu balik 0 -- itu kenapa padding
         tambahan di .mobile-bottom-tabs (Sidebar.css) nggak pernah
         kerasa di iPhone walau di Android udah kelihatan. Di Android
         atribut ini nggak berpengaruh/aman diabaikan. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Dapur MUA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
